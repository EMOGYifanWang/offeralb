name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 单元测试
        run: npm test

      - name: 确定性评测（不调模型、不花钱）
        run: npm run eval

      - name: 构建
        run: npm run build
